<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#8B7BE8" />
  <title>Intimate Unknowns — Ask a Question</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="mobile">

  <header class="brand">
    Intimate Unknowns
    <span class="title">Ask your question.</span>
  </header>

  <main>
    <div class="form-wrap" id="form-view">
      <label for="qname">Name <span style="opacity:.6">(optional)</span></label>
      <input id="qname" type="text" maxlength="60" autocomplete="off" placeholder="e.g. anonymous or your first name" />

      <label for="qtext">Your question for the panel</label>
      <textarea id="qtext" maxlength="300" placeholder="What would you like to know?"></textarea>
      <div class="charcount"><span id="counter">0</span> / 300</div>

      <button class="send" id="send-btn" disabled>Send question</button>
    </div>

    <div class="form-wrap success" id="success-view" style="display:none">
      <div class="success-icon">✓</div>
      <h2>Your question has been received.</h2>
      <p>It will appear on screen in a moment. Feel free to ask another.</p>
      <button id="again-btn">Ask another question</button>
    </div>
  </main>

  <footer class="footer-note">
    CPDP Panel · Intimate Unknowns: Sentiment<br />
    Your question is shown live and anonymously on stage.
  </footer>

  <script src="./app-store.js"></script>

  <script>
    const $text = document.getElementById('qtext');
    const $name = document.getElementById('qname');
    const $btn = document.getElementById('send-btn');
    const $count = document.getElementById('counter');
    const $form = document.getElementById('form-view');
    const $success = document.getElementById('success-view');
    const $again = document.getElementById('again-btn');

    $text.addEventListener('input', () => {
      const len = $text.value.trim().length;
      $count.textContent = $text.value.length;
      $btn.disabled = len === 0;
    });

    $btn.addEventListener('click', async () => {
      const text = $text.value.trim();
      const name = $name.value.trim();
      if (!text) return;
      $btn.disabled = true;
      $btn.textContent = 'Sending …';
      try {
        await window.QStore.submit({ text, name });
        $form.style.display = 'none';
        $success.style.display = 'block';
        $text.value = '';
        $count.textContent = '0';
        if (navigator.vibrate) navigator.vibrate(30);
      } catch (err) {
        console.error(err);
        alert('Sending failed. Please try again.');
        $btn.disabled = false;
        $btn.textContent = 'Send question';
      }
    });

    $again.addEventListener('click', () => {
      $success.style.display = 'none';
      $form.style.display = 'block';
      $btn.disabled = true;
      $btn.textContent = 'Send question';
      $text.focus();
    });
  </script>
</body>
</html>
