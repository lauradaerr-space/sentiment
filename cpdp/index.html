<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#8B7BE8" />
  <title>Intimate Unknowns — Frage stellen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="mobile">

  <header class="brand">
    Intimate Unknowns
    <span class="title">Stell deine Frage.</span>
  </header>

  <main>
    <div class="form-wrap" id="form-view">
      <label for="qname">Name <span style="opacity:.6">(optional)</span></label>
      <input id="qname" type="text" maxlength="60" autocomplete="off" placeholder="z.B. anonym oder dein Vorname" />

      <label for="qtext">Deine Frage ans Panel</label>
      <textarea id="qtext" maxlength="300" placeholder="Was möchtest du wissen?"></textarea>
      <div class="charcount"><span id="counter">0</span> / 300</div>

      <button class="send" id="send-btn" disabled>Frage senden</button>
    </div>

    <div class="form-wrap success" id="success-view" style="display:none">
      <div class="success-icon">✓</div>
      <h2>Deine Frage ist angekommen.</h2>
      <p>Sie erscheint gleich auf dem Bildschirm. Du kannst gerne noch eine Frage stellen.</p>
      <button id="again-btn">Noch eine Frage stellen</button>
    </div>
  </main>

  <footer class="footer-note">
    CPDP Panel · Intimate Unknowns: Sentiment<br />
    Deine Frage wird live und anonym auf der Bühne gezeigt.
  </footer>

  <!-- Firebase SDK (compat build — keeps things simple, no bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./app-firebase.js"></script>

  <script>
    const $text = document.getElementById('qtext');
    const $name = document.getElementById('qname');
    const $btn = document.getElementById('send-btn');
    const $count = document.getElementById('counter');
    const $form = document.getElementById('form-view');
    const $success = document.getElementById('success-view');
    const $again = document.getElementById('again-btn');

    $text.addEventListener('input', () => {
      const len = $text.value.trim().length;
      $count.textContent = $text.value.length;
      $btn.disabled = len === 0;
    });

    $btn.addEventListener('click', async () => {
      const text = $text.value.trim();
      const name = $name.value.trim();
      if (!text) return;
      $btn.disabled = true;
      $btn.textContent = 'Senden …';
      try {
        await window.QStore.submit({ text, name });
        $form.style.display = 'none';
        $success.style.display = 'block';
        $text.value = '';
        $count.textContent = '0';
        if (navigator.vibrate) navigator.vibrate(30);
      } catch (err) {
        console.error(err);
        alert('Senden hat nicht geklappt. Bitte nochmal versuchen.');
        $btn.disabled = false;
        $btn.textContent = 'Frage senden';
      }
    });

    $again.addEventListener('click', () => {
      $success.style.display = 'none';
      $form.style.display = 'block';
      $btn.disabled = true;
      $btn.textContent = 'Frage senden';
      $text.focus();
    });
  </script>
</body>
</html>
